# ───────────────────────────────────────────────────────────────────────
# GraphicAI · drafting atelier
# Production-grade compose: optimized image, env_file, healthcheck,
# restart policy, named volume for .next cache (warm restarts).
# ───────────────────────────────────────────────────────────────────────
services:
  web:
    container_name: graphicai
    build:
      context: .
      dockerfile: Dockerfile
    image: graphicai:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # GEMINI_API_KEY is loaded from .env (see env_file below) but can
      # also be exported in the shell; shell takes precedence.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Run with:
#   docker compose up -d --build
# Tear down with:
#   docker compose down
