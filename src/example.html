<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Graphics - Projection Solver</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            width: 100%;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 1050px;
            width: 100%;
            box-sizing: border-box;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        label {
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
        }
        select {
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            flex: 1;
            background-color: #fff;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        select:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        .problem-desc {
            background: #f8f9fa;
            padding: 16px 20px;
            border-left: 4px solid #2b6cb0;
            border-radius: 0 6px 6px 0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #4a5568;
        }
        .canvas-container {
            position: relative;
            overflow-x: auto;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        canvas {
            background-color: #fafafa;
            display: block;
            margin: 0 auto;
            width: 100%;
            height: 550px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        .steps-card {
            margin-top: 30px;
            background: #f1f3f5;
            padding: 20px 25px;
            border-left: 5px solid #2b6cb0;
            border-radius: 6px;
        }
        .steps-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #2b6cb0;
            font-size: 18px;
        }
        ol {
            padding-left: 20px;
            line-height: 1.6;
            margin: 0;
            color: #2d3748;
            font-size: 15px;
        }
        li {
            margin-bottom: 10px;
        }
        li strong {
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Engineering Graphics: Projection Solver</h2>
    
    <div class="controls">
        <label for="problem-select">Select Problem:</label>
        <select id="problem-select"></select>
    </div>
    
    <div class="problem-desc" id="problem-desc"></div>
    
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="box" style="background: #e53e3e;"></div> Front View (FV)</div>
        <div class="legend-item"><div class="box" style="background: #3182ce;"></div> Top View (TV)</div>
        <div class="legend-item"><div class="box" style="background: #a0aec0; height: 3px; border-radius:0; width: 24px;"></div> Projectors / Locus</div>
    </div>

    <div class="steps-card">
        <h3>Calculated Orientations & Output Values</h3>
        <ol id="steps-list"></ol>
    </div>
</div>

<script>
    const Problems = [
      {
        id: 1,
        title: "1. Square Plate (Diagonal ratio 1:2)",
        text: "<strong>Problem Statement:</strong> A thin square plate of side 40 mm stands on one of its corners in HP and the opposite corner is raised so that one of the diagonals is twice of the other. If one of the diagonals is parallel to both the reference planes, draw its projections.",
        solve: () => {
          const s = 40;
          const d = s * Math.SQRT2;
          const pts = [
            {x: 0, y: 0, label: 'a'},
            {x: d/2, y: -d/2, label: 'b'},
            {x: d, y: 0, label: 'c'},
            {x: d/2, y: d/2, label: 'd'}
          ];
          const hpAngle = Math.acos(0.5); 
          const vpAngle = -Math.PI / 2; 
          return {pts, hpAngle, vpAngle, scale: 2.2, steps: [
            "<strong>True Shape:</strong> Square of side 40mm. True Diagonal = 56.57mm.", 
            "<strong>HP Tilt:</strong> Diagonal 'ac' foreshortened to half length (28.28mm). θ = cos⁻¹(0.5) = 60°.", 
            "<strong>VP Tilt:</strong> Rotate 90° so true-length diagonal 'bd' becomes parallel to XY."
          ]};
        }
      },
      {
        id: 2,
        title: "2. Rhombus / Square Lamina",
        text: "<strong>Problem Statement:</strong> A rhombus of diagonals 60 mm and 40 mm having the longer diagonal parallel to the reference line represents the top view of a square lamina of diagonals 60 mm resting on a corner on the HP. Draw the projections.",
        solve: () => {
          const d = 60;
          const pts = [
            {x: 0, y: 0, label: 'a'},
            {x: d/2, y: -d/2, label: 'b'},
            {x: d, y: 0, label: 'c'},
            {x: d/2, y: d/2, label: 'd'}
          ];
          const hpAngle = Math.acos(40 / 60); 
          const vpAngle = -Math.PI / 2; 
          return {pts, hpAngle, vpAngle, scale: 1.8, steps: [
            "<strong>True Shape:</strong> Square of diagonal 60mm.", 
            "<strong>HP Tilt:</strong> Diagonal 'ac' foreshortened to 40mm. θ = cos⁻¹(40/60) = 48.19°.", 
            "<strong>VP Tilt:</strong> Rotate 90° so true-length diagonal 'bd' is parallel to VP."
          ]};
        }
      },
      {
        id: 3,
        title: "3. Isosceles Triangular Plate",
        text: "<strong>Problem Statement:</strong> An isosceles triangular plate of base side 50 mm & altitude 70 mm is resting in HP on its apex corner. Draw the projections if the side opposite to resting corner is 50 mm above HP & the plan altitude of triangle is inclined 30° with VP.",
        solve: () => {
          const base = 50;
          const alt = 70;
          const pts = [
            {x: 0, y: 0, label: 'a'},
            {x: alt, y: -base/2, label: 'b'},
            {x: alt, y: base/2, label: 'c'}
          ];
          const hpAngle = Math.asin(50 / 70);
          const vpAngle = 30 * Math.PI / 180;
          return {pts, hpAngle, vpAngle, scale: 1.8, steps: [
            "<strong>True Shape:</strong> Isosceles triangle, altitude 70mm, base 50mm.", 
            "<strong>HP Tilt:</strong> Opposite side is 50mm above HP. θ = sin⁻¹(50/70) = 45.58°.", 
            "<strong>VP Tilt:</strong> Rotate 30° (Plan altitude is apparent length directly inclined 30° to VP)."
          ]};
        }
      },
      {
        id: 4,
        title: "4. Equilateral Triangle",
        text: "<strong>Problem Statement:</strong> A Triangular plane figure of sides 25 mm is resting on HP with one of its corners, such that the surface of the lamina makes an angle of 60 deg. with HP. If the side opposite to the corner on which the lamina rests makes an angle of 30 deg. with VP. Draw the top and front views.",
        solve: () => {
          const s = 25;
          const alt = s * Math.sqrt(3) / 2;
          const pts = [
            {x: 0, y: 0, label: 'a'},
            {x: alt, y: -s/2, label: 'b'},
            {x: alt, y: s/2, label: 'c'}
          ];
          const hpAngle = 60 * Math.PI / 180;
          const vpAngle = -60 * Math.PI / 180;
          return {pts, hpAngle, vpAngle, scale: 3.5, steps: [
            "<strong>True Shape:</strong> Equilateral Triangle side 25mm.", 
            "<strong>HP Tilt:</strong> Surface inclined at 60° to HP.", 
            "<strong>VP Tilt:</strong> Opposite edge 'bc' is initially at 90°. Rotate -60° to make it 30° to VP."
          ]};
        }
      },
      {
        id: 5,
        title: "5. Pentagonal Lamina",
        text: "<strong>Problem Statement:</strong> Pentagonal lamina of edges 25 mm is resting on HP with one of its corners such that the plane surface makes an angle of 60 deg. with HP. When the edge opposite to the corner makes an angle of 45 deg. with VP. Draw the top and front views.",
        solve: () => {
          const s = 25;
          const R = s / (2 * Math.sin(Math.PI / 5)); 
          const pts = [];
          for(let i=0; i<5; i++) {
            const angle = i * 2 * Math.PI / 5;
            pts.push({
              x: R - R * Math.cos(angle),
              y: R * Math.sin(angle),
              label: String.fromCharCode(97 + i)
            });
          }
          const hpAngle = 60 * Math.PI / 180;
          const vpAngle = -45 * Math.PI / 180;
          return {pts, hpAngle, vpAngle, scale: 3.0, steps: [
            "<strong>True Shape:</strong> Pentagon side 25mm resting on corner.", 
            "<strong>HP Tilt:</strong> Surface inclined at 60° to HP.", 
            "<strong>VP Tilt:</strong> Opposite edge 'cd' is initially at 90°. Rotate -45° to make it 45° to VP."
          ]};
        }
      },
      {
        id: 6,
        title: "6. Rectangular Plane",
        text: "<strong>Problem Statement:</strong> A rectangular plane of edges 35 mm and 70 mm is resting on an edge in the HP. The surface is inclined to HP such that top view appears as a square. Draw its projections when the edge resting on HP is inclined at 30 degree to VP.",
        solve: () => {
          const pts = [
            {x: 0, y: -35/2, label: 'a'},
            {x: 70, y: -35/2, label: 'b'},
            {x: 70, y: 35/2, label: 'c'},
            {x: 0, y: 35/2, label: 'd'}
          ];
          const hpAngle = Math.acos(35 / 70);
          const vpAngle = -60 * Math.PI / 180;
          return {pts, hpAngle, vpAngle, scale: 2.2, steps: [
            "<strong>True Shape:</strong> Rectangle 35x70mm resting on shorter edge.", 
            "<strong>HP Tilt:</strong> TV is a square. 70mm side foreshortened to 35mm. θ = cos⁻¹(35/70) = 60°.", 
            "<strong>VP Tilt:</strong> Resting edge 'ad' is initially at 90°. Rotate -60° to make it 30° to VP."
          ]};
        }
      },
      {
        id: 7,
        title: "7. Hexagonal Lamina",
        text: "<strong>Problem Statement:</strong> A hexagonal lamina of sides 25 mm rests on one of its corners on HP. The lamina makes 45 deg. to HP and the diagonal passing through the corner on which it rests is inclined at 30 deg. to VP. Draw its projections.",
        solve: () => {
          const s = 25;
          const pts = [];
          for(let i=0; i<6; i++) {
            const angle = i * Math.PI / 3;
            pts.push({
              x: s - s * Math.cos(angle),
              y: s * Math.sin(angle),
              label: String.fromCharCode(97 + i)
            });
          }
          const hpAngle = 45 * Math.PI / 180;
          const vpAngle = 30 * Math.PI / 180;
          return {pts, hpAngle, vpAngle, scale: 3.5, steps: [
            "<strong>True Shape:</strong> Hexagon side 25mm resting on corner.", 
            "<strong>HP Tilt:</strong> Surface inclined at 45° to HP.", 
            "<strong>VP Tilt:</strong> Diagonal apparent angle is 30°. Apply Z-axis rotation by 30°."
          ]};
        }
      },
      {
        id: 8,
        title: "8. Circular Lamina",
        text: "<strong>Problem Statement:</strong> A circular lamina of 50 mm diameter rests on HP such that one of its diameter is inclined at 30 deg. to VP and 45 deg. to HP. Draw its top and front views.",
        solve: () => {
          const r = 25;
          const pts = [];
          for(let i=0; i<12; i++) {
            const angle = i * Math.PI / 6;
            pts.push({
              x: r - r * Math.cos(angle),
              y: r * Math.sin(angle),
              label: String.fromCharCode(97 + i)
            });
          }
          const hpAngle = 45 * Math.PI / 180;
          const trueAngle = 30 * Math.PI / 180;
          const beta = Math.atan(Math.tan(trueAngle) / Math.cos(hpAngle));
          const vpAngle = beta;
          return {pts, hpAngle, vpAngle, scale: 2.5, steps: [
            "<strong>True Shape:</strong> Circle of diameter 50mm (approximated with 12 points).", 
            "<strong>HP Tilt:</strong> Surface inclined at 45° to HP.", 
            "<strong>VP Tilt:</strong> True angle 30° -> Apparent Angle β = arctan(tan(30°) / cos(45°)) = " + (beta*180/Math.PI).toFixed(1) + "°."
          ]};
        }
      }
    ];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentProblemIndex = 0;

    const COLOR_XY = '#4a5568';
    const COLOR_PROJ = '#a0aec0';
    const COLOR_FV = '#e53e3e';
    const COLOR_TV = '#3182ce';
    const TEXT_COLOR = '#2d3748';

    function drawLine(x1, y1, x2, y2, color, isDash = false) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      if (isDash) ctx.setLineDash([4, 4]);
      else ctx.setLineDash([]);
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function render() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const cw = rect.width;
      const ch = 550;
      
      ctx.clearRect(0, 0, cw, ch);

      const problem = Problems[currentProblemIndex];
      const {pts, hpAngle, vpAngle, scale, steps} = problem.solve();
      
      document.getElementById('problem-desc').innerHTML = problem.text;
      
      const stepsList = document.getElementById('steps-list');
      stepsList.innerHTML = '';
      steps.forEach(step => {
        let li = document.createElement('li');
        li.innerHTML = step;
        stepsList.appendChild(li);
      });

      let minRotatedY = Infinity;
      pts.forEach(p => {
        if (p.y < minRotatedY) minRotatedY = p.y; 
        let tx = p.x * Math.cos(hpAngle);
        let ry = tx * Math.sin(vpAngle) + p.y * Math.cos(vpAngle);
        if (ry < minRotatedY) minRotatedY = ry; 
      });
      const globalYOffset = 30 / scale - minRotatedY;

      let views = [];
      let st1 = pts.map(p => ({ x: p.x, y: p.y + globalYOffset, z: 0, label: p.label }));
      views.push(st1);

      let st2 = pts.map(p => ({ x: p.x * Math.cos(hpAngle), y: p.y + globalYOffset, z: p.x * Math.sin(hpAngle), label: p.label }));
      views.push(st2);

      let st3 = pts.map(p => {
        let tx = p.x * Math.cos(hpAngle);
        let ty = p.y;
        let rx = tx * Math.cos(vpAngle) - ty * Math.sin(vpAngle);
        let ry = tx * Math.sin(vpAngle) + ty * Math.cos(vpAngle);
        return { x: rx, y: ry + globalYOffset, z: p.x * Math.sin(hpAngle), label: p.label };
      });
      views.push(st3);

      function getBBox(view) {
        let minX = Infinity, maxX = -Infinity;
        view.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
        });
        return { minX, maxX, width: maxX - minX };
      }

      let b1 = getBBox(views[0]);
      let b2 = getBBox(views[1]);
      let b3 = getBBox(views[2]);

      const gap = 120;
      const totalWidth = b1.width*scale + b2.width*scale + b3.width*scale + 2*gap;
      let ox1 = (cw - totalWidth) / 2 - b1.minX*scale;
      if (ox1 < 40) ox1 = 40 - b1.minX*scale;

      let ox2 = ox1 + b1.width * scale + gap - b2.minX * scale;
      let ox3 = ox2 + b2.width * scale + gap - b3.minX * scale;

      const oy = 250;
      const offsets = [ {x: ox1}, {x: ox2}, {x: ox3} ];

      ctx.lineWidth = 1.5;
      drawLine(20, oy, cw - 20, oy, COLOR_XY);
      
      ctx.fillStyle = COLOR_XY;
      ctx.font = '13px "Segoe UI", sans-serif';
      ctx.fillText("X", 30, oy - 10);
      ctx.fillText("Y", cw - 40, oy - 10);
      ctx.fillText("VP", 30, oy - 25);
      ctx.fillText("HP", 30, oy + 25);

      ctx.lineWidth = 1;
      
      views[0].forEach(p => drawLine(ox1 + p.x*scale, oy + p.y*scale, ox1 + p.x*scale, oy - p.z*scale, COLOR_PROJ));

      views[1].forEach((p, idx) => {
        let p1 = views[0][idx];
        drawLine(ox2 + p.x*scale, oy - p.z*scale, ox2 + p.x*scale, oy + p.y*scale, COLOR_PROJ);
        drawLine(ox1 + p1.x*scale, oy + p1.y*scale, ox2 + p.x*scale, oy + p.y*scale, COLOR_PROJ, true); 
      });

      views[2].forEach((p, idx) => {
        let p2 = views[1][idx];
        drawLine(ox3 + p.x*scale, oy + p.y*scale, ox3 + p.x*scale, oy - p.z*scale, COLOR_PROJ);
        drawLine(ox2 + p2.x*scale, oy - p2.z*scale, ox3 + p.x*scale, oy - p.z*scale, COLOR_PROJ, true);
      });

      ctx.setLineDash([]);

      for(let i=0; i<3; i++) {
        let view = views[i];
        let ox = offsets[i].x;
        
        ctx.strokeStyle = COLOR_TV;
        ctx.fillStyle = 'rgba(49, 130, 206, 0.08)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(ox + view[0].x * scale, oy + view[0].y * scale);
        for(let j=1; j<view.length; j++) {
          ctx.lineTo(ox + view[j].x * scale, oy + view[j].y * scale);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.strokeStyle = COLOR_FV;
        ctx.fillStyle = 'rgba(229, 62, 62, 0.08)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(ox + view[0].x * scale, oy - view[0].z * scale);
        for(let j=1; j<view.length; j++) {
          ctx.lineTo(ox + view[j].x * scale, oy - view[j].z * scale);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.font = 'bold 13px "Segoe UI", sans-serif';
        view.forEach(p => {
          let vx = ox + p.x * scale;
          let vty = oy + p.y * scale;
          let vfy = oy - p.z * scale;
          
          ctx.fillStyle = TEXT_COLOR;
          ctx.fillText(p.label, vx + 6, vty + 14);
          ctx.fillText(p.label + "'", vx + 6, vfy - 8);
          
          ctx.fillStyle = COLOR_TV;
          ctx.beginPath(); ctx.arc(vx, vty, 2.5, 0, Math.PI*2); ctx.fill();
          
          ctx.fillStyle = COLOR_FV;
          ctx.beginPath(); ctx.arc(vx, vfy, 2.5, 0, Math.PI*2); ctx.fill();
        });

        ctx.fillStyle = '#718096';
        ctx.font = '13px "Segoe UI", sans-serif';
        let title = i === 0 ? "Stage 1: True Shape" : i === 1 ? "Stage 2: HP Inclination" : "Stage 3: VP Inclination";
        let currentBBox = i === 0 ? b1 : i === 1 ? b2 : b3;
        ctx.fillText(title, ox + (currentBBox.width*scale)/2 - 60, oy + 260);
      }
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = 550 * window.devicePixelRatio;
      canvas.style.height = '550px';
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      render();
    }

    window.addEventListener('resize', resize);

    window.onload = () => {
      const select = document.getElementById('problem-select');
      Problems.forEach((p, idx) => {
        let opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = p.title;
        select.appendChild(opt);
      });
      select.addEventListener('change', (e) => {
        currentProblemIndex = parseInt(e.target.value);
        render();
      });
      resize();
    };
</script>
</body>
</html>
